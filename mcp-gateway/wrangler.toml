name = "mcp-gateway"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MCP_VERSION = "2024-11-05"

# ===========================================
# SECURITY SECRETS (set via `wrangler secret put <NAME>`)
# ===========================================
# MCP_AUTH_TOKEN       <- REQUIRED: Bearer token for authentication
# EXA_API_KEY
# FIRECRAWL_API_KEY
# TAVILY_API_KEY
# BRAVE_API_KEY
# QDRANT_API_KEY
# QDRANT_URL
# CONTEXT7_API_KEY
# OPENROUTER_API_KEY
# GEMINI_API_KEY
# GROQ_API_KEY
# BROWSERBASE_API_KEY  <- Cloud Browser Control

# ===========================================
# SECURITY NOTES
# ===========================================
# 1. All requests require: Authorization: Bearer <MCP_AUTH_TOKEN>
# 2. CORS is disabled (server-to-server only)
# 3. Configure Cloudflare Rate Limiting in dashboard: 60 req/min
# 4. Optional: Enable Cloudflare Access for IP allowlisting
