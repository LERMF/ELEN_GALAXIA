[package]
name = "quantum_neofuse_mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["io-std", "rt"] }  # OPTIMIZED: Minimal for stdin MCP
serde = { version = "1.0", features = ["derive"] }
